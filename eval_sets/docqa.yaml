  route_pressure: route_s
  query: "Which upstream market-condition measure supplies the consistency signal used when assessing trade confidence?"
  notes: "This row intentionally targets the same section as sem-001 but tests a different failure mode: the intended object is held constant while the query vocabulary changes, providing a schema-level contrast between semantic and lexical gaps. Route pressure is route_s because closing a lexical gap requires matching across different vocabulary — again a capability of dense embeddings rather than reranking."

