- id: qse-docqa-sem-001
  task: doc_qa
  text_type: markdown_note
  length: short
  specificity: matched
  domain: in_scope
  hops: single
  lexical_overlap: high
  ambiguity: polysemy
  ood_kind: ""
  expected:
    - 1_upstream_producer_score_definition
  failure_mode: semantic gap
  hypothesis: "If the query is interpreted as the conviction-related sense of regime, retrieval should select the section defining the upstream score rather than the separate RegimeBoss sense; a miss would indicate that the surrounding context is insufficient to disambiguate the two senses."
  current_stack_prediction: expected_miss
  route_pressure: route_s
  query: "What does the regime-related score represent when it contributes to the conviction assessment?"
  notes: "The producer section is the expected target because the query asks what the regime-related score represents, making the upstream score definition the direct evidence rather than the downstream verdict. Route pressure is route_s because polysemy rescue requires distinguishing senses of a shared token — a capability of dense/multi-vector embeddings, not of reranking. Reranking would still see one 'regime' sense per chunk."

